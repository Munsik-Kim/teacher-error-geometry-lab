[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-error-geometry"
version = "0.2.0"
description = "A CPU reproduction of teacher-student regression theory"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "matplotlib==3.10.9"]
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
